# Publishes the site to GitHub Pages on every push to main.
# Settings > Pages > Source must be set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Includes the check that no service_role key is in the repo.
      - name: Run tests
        run: npm test

      # Publish only the website, not tests, SQL or docs.
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html admin.html css js _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
